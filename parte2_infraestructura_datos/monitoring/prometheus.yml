# Configuracion de Prometheus - nodo central
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se monitoriza a si mismo
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

