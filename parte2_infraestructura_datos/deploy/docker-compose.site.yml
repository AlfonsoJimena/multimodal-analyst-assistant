# =====================================================================
# Plantilla de despliegue de UNA sede 
#
# El mismo fichero sirve para las tres sedes; solo cambia el .env.
# Uso:
#   docker compose -p <sede> --env-file sites/<sede>.env \
#       -f deploy/docker-compose.site.yml up -d
#
# Servicios: kafka + postgres + producer + spark (stream/silver/sink) + site_api
# El coordinator es opcional y se activa con el profile "coordinator" en
# CUALQUIER sede (issue #59): Central es el primario y Chamartin/Atocha
# los respaldos. Orden de failover: ver README (Coordinador replicado).
#
# Red externa compartida (INTERCONNECT_NETWORK, por defecto
# "pids-interconnect"): une site_api y coordinator de las tres sedes
# para que cualquier coordinador llegue a las tres APIs. Debe existir
# antes del 'up' (el Makefile la crea: make network).
#
# Variables esperadas del .env:
#   SITE_ID, SITE_API_PORT, POSTGRES_PORT,
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD,
#   KAFKA_TOPIC, ACCELERATION_FACTOR, SPARK_VERSION,
#   COORDINATOR_PORT
# Opcionales (despliegue en varias maquinas):
#   INTERCONNECT_NETWORK, SITE_API_URL_CENTRAL, SITE_API_URL_CHAMARTIN,
#   SITE_API_URL_ATOCHA
# =====================================================================

services:

  # ------------------------------------------------------------------
  # Bus de mensajes (Kafka en modo KRaft, un solo nodo)
  # ------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: ${SITE_ID:-site}-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - site

  # ------------------------------------------------------------------
  # Base de datos de la sede (Gold + cuarentena)
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: ${SITE_ID:-site}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pids}
      POSTGRES_USER: ${POSTGRES_USER:-pids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pids}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../sql/quarantine.sql:/docker-entrypoint-initdb.d/02_quarantine.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pids} -d ${POSTGRES_DB:-pids}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - site

  # ------------------------------------------------------------------
  # Producer: publica los viajes realtime de esta sede a Kafka
  # ------------------------------------------------------------------
  producer:
    build:
      context: ..
      dockerfile: src/producer/Dockerfile
    container_name: ${SITE_ID:-site}-producer
    restart: on-failure
    environment:
      SITE_ID: ${SITE_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-taxi-trips}
      REALTIME_FILE: data/prepared/${SITE_ID}/realtime.csv
      ACCELERATION_FACTOR: ${ACCELERATION_FACTOR:-60}
      METRICS_PORT: 9000
    ports:
      # Metricas Prometheus del producer (issue #65)
      - "${PRODUCER_METRICS_PORT:-9000}:9000"
    volumes:
      # Datos de entrada preparados (issue #48). Solo lectura.
      - ../data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - site

  # ------------------------------------------------------------------
  # Spark job 1/3: ingesta desde Kafka -> Bronze (streaming)
  # (unico que necesita el conector Kafka de Spark)
  # ------------------------------------------------------------------
  spark_stream_bronze:
    build:
      context: ..
      dockerfile: src/spark_jobs/Dockerfile
    container_name: ${SITE_ID:-site}-spark-stream-bronze
    restart: on-failure
    command: ["python", "-m", "src.spark_jobs.stream_bronze"]
    environment:
      SITE_ID: ${SITE_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-taxi-trips}
      BRONZE_PATH: data/lakehouse/bronze
      CHECKPOINT_PATH: data/checkpoints/stream_bronze/${SITE_ID}
      PYSPARK_SUBMIT_ARGS: "--packages org.apache.spark:spark-sql-kafka-0-10_2.13:${SPARK_VERSION:-4.2.0} pyspark-shell"
    volumes:
      - lakehouse:/app/data/lakehouse
      - checkpoints:/app/data/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - site

  # ------------------------------------------------------------------
  # Spark job batch (one-shot): historico CSV -> Bronze
  # Se ejecuta una vez y termina. Si el historico de la sede ya esta en
  # Bronze no vuelve a cargarlo (ver batch_bronze.py): cargarlo dos veces
  # duplicaria los viajes en Gold.
  # ------------------------------------------------------------------
  spark_batch_bronze:
    build:
      context: ..
      dockerfile: src/spark_jobs/Dockerfile
    container_name: ${SITE_ID:-site}-spark-batch-bronze
    restart: "no"
    command: ["python", "-m", "src.spark_jobs.batch_bronze"]
    environment:
      SITE_ID: ${SITE_ID}
      HISTORICAL_FILE: data/prepared/${SITE_ID}/historical.csv
      BRONZE_PATH: data/lakehouse/bronze
    volumes:
      # Datos preparados (issue #48). Solo lectura.
      - ../data/prepared:/app/data/prepared:ro
      - lakehouse:/app/data/lakehouse
    networks:
      - site

  # ------------------------------------------------------------------
  # Spark job 2/3: Bronze -> Silver (+ cuarentena) (streaming)
  # ------------------------------------------------------------------
  spark_silver:
    build:
      context: ..
      dockerfile: src/spark_jobs/Dockerfile
    container_name: ${SITE_ID:-site}-spark-silver
    restart: on-failure
    command: ["python", "-m", "src.spark_jobs.silver"]
    environment:
      SITE_ID: ${SITE_ID}
      BRONZE_PATH: data/lakehouse/bronze
      SILVER_PATH: data/lakehouse/silver
      QUARANTINE_PATH: data/lakehouse/quarantine
      CHECKPOINT_PATH: data/checkpoints/silver/${SITE_ID}
    volumes:
      - lakehouse:/app/data/lakehouse
      - checkpoints:/app/data/checkpoints
    depends_on:
      spark_stream_bronze:
        condition: service_started
      # El historico entra en Bronze antes de que Silver empiece a leer.
      spark_batch_bronze:
        condition: service_completed_successfully
    networks:
      - site

  # ------------------------------------------------------------------
  # Spark job 3/3: Silver -> Postgres (upsert de agregados Gold) (streaming)
  # ------------------------------------------------------------------
  spark_sink_postgres:
    build:
      context: ..
      dockerfile: src/spark_jobs/Dockerfile
    container_name: ${SITE_ID:-site}-spark-sink-postgres
    restart: on-failure
    command: ["python", "-m", "src.spark_jobs.sink_postgres"]
    environment:
      SITE_ID: ${SITE_ID}
      SILVER_PATH: data/lakehouse/silver
      CHECKPOINT_PATH: data/checkpoints/sink_postgres/${SITE_ID}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pids}
      POSTGRES_USER: ${POSTGRES_USER:-pids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pids}
    volumes:
      - lakehouse:/app/data/lakehouse
      - checkpoints:/app/data/checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      spark_silver:
        condition: service_started
    networks:
      - site

  # ------------------------------------------------------------------
  # API de la sede: unica salida de datos (agregados combinables)
  # ------------------------------------------------------------------
  site_api:
    build:
      context: ..
      dockerfile: src/site_api/Dockerfile
    container_name: ${SITE_ID:-site}-site-api
    restart: unless-stopped
    environment:
      SITE_ID: ${SITE_ID}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-pids}
      POSTGRES_USER: ${POSTGRES_USER:-pids}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pids}
    ports:
      - "${SITE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      site:
      interconnect:
        # Nombre estable por sede en la red compartida: es la URL por
        # defecto que usa src/coordinator/clients.py (site-api-<sede>).
        aliases:
          - site-api-${SITE_ID}

  # ------------------------------------------------------------------
  # Coordinador: OPCIONAL, profile "coordinator", activable en cualquier
  # sede (issue #59). Es stateless: cada replica consulta las tres
  # site_api y combina los agregados, sin sincronizar nada con las demas.
  # Failover (lo decide el cliente): central -> chamartin -> atocha.
  # ------------------------------------------------------------------
  coordinator:
    profiles: ["coordinator"]
    build:
      context: ..
      dockerfile: src/coordinator/Dockerfile
    container_name: ${SITE_ID:-site}-coordinator
    restart: unless-stopped
    environment:
      SITE_ID: ${SITE_ID}
      SITE_API_URL_CENTRAL: ${SITE_API_URL_CENTRAL:-http://site-api-central:8000}
      SITE_API_URL_CHAMARTIN: ${SITE_API_URL_CHAMARTIN:-http://site-api-chamartin:8000}
      SITE_API_URL_ATOCHA: ${SITE_API_URL_ATOCHA:-http://site-api-atocha:8000}
    ports:
      - "${COORDINATOR_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - interconnect

volumes:
  pgdata:
  lakehouse:
  checkpoints:

networks:
  site:
    driver: bridge
  # Red compartida entre sedes (site_api + coordinator). Externa porque
  # la comparten tres proyectos compose distintos: la crea 'make network'.
  interconnect:
    name: ${INTERCONNECT_NETWORK:-pids-interconnect}
    external: true
